server {
    listen 443 ssl http2;
    server_name geo.ornek.com;
    ssl_certificate     /etc/letsencrypt/live/geo.ornek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.ornek.com/privkey.pem;
    client_max_body_size 300k;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }
}
